
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  namespace: argocd
spec:
  replicas: 0
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      containers:
        - name: nodejs-app
          image: ohadd306/nodejs-app:latest
          ports:
            - containerPort: 3000
